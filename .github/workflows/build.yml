name: Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "*.sln"
      - "Directory.Build.props"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/PortSentinel/PortSentinel.csproj

      - name: Build
        run: dotnet build src/PortSentinel/PortSentinel.csproj --configuration Release --no-restore

      - name: Publish smoke build
        run: >-
          dotnet publish src/PortSentinel/PortSentinel.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/PortSentinel

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortSentinel-win-x64
          path: artifacts/PortSentinel/
          if-no-files-found: error

name: Cleanup merged branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete merged release branches
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            "agent/portsentinel-v0.2.0"
            "agent/run-bootstrap-v020"
            "agent/v0.4.0-explainable-rules"
            "agent/v0.5.0-extended-telemetry"
            "agent/v0.5.1-etw-telemetry"
            "agent/v0.5.2-telemetry-archive"
            "agent/v0.5.3-archive-operations"
            "agent/v0.5.4-connection-health"
            "agent/v0.5.5-network-coverage"
            "agent/v0.5.6-timeline-explorer"
            "agent/v0.5.7-installer-watch"
            "agent/validate-v020"
            "release/publish-v0.2.0"
            "release/publish-v0.3.0"
            "release/v0.2.0"
            "release/v0.3.0"
            "release/v0.4.0"
          )

          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
          done

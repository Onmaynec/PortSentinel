<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">PortSentinel</title>
  <desc id="desc">Shield with network nodes and PortSentinel wordmark</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="260" rx="28" fill="url(#bg)"/>
  <g transform="translate(55 28)">
    <path d="M100 6 184 37v62c0 58-35 91-84 111C51 190 16 157 16 99V37Z" fill="#0b1f33" stroke="url(#shield)" stroke-width="7"/>
    <circle cx="100" cy="76" r="12" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="62" cy="126" r="10" fill="#60a5fa"/>
    <circle cx="138" cy="126" r="10" fill="#60a5fa"/>
    <circle cx="100" cy="166" r="10" fill="#a78bfa"/>
    <path d="M100 88v29M91 121l-20 5M109 121l20 5M70 134l23 26M130 134l-23 26" fill="none" stroke="#9bdcf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(285 72)">
    <text x="0" y="58" fill="#eaf6ff" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">PortSentinel</text>
    <text x="3" y="105" fill="#8ecae6" font-family="Segoe UI, Arial, sans-serif" font-size="23">See which Windows processes are talking to the network.</text>
  </g>
</svg>
